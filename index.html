<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="init()">

    <header>
        <div class="header-inner">
            <div class="logo-container">
                <!-- Pokéball-Logo als SVG (bleibt in jeder Größe scharf) -->
                <svg class="logo-ball" viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="46" fill="#f8fafc" />
                    <path d="M4 50a46 46 0 0 1 92 0z" fill="#ef4444" />
                    <rect x="4" y="46" width="92" height="8" fill="#0f172a" />
                    <circle cx="50" cy="50" r="46" fill="none" stroke="#0f172a" stroke-width="7" />
                    <circle cx="50" cy="50" r="15" fill="#f8fafc" stroke="#0f172a" stroke-width="7" />
                    <circle cx="50" cy="50" r="6" fill="#22d3ee" />
                </svg>
                <div class="logo-text">
                    <h1>Poké<span>dex</span></h1>
                    <p>Entdecke die Welt der Pokémon</p>
                </div>
            </div>
            <div class="search-container">
                <div class="search-field">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input id="searchInput" type="text" placeholder="Pokémon suchen..." aria-label="Pokémon suchen"
                        onkeydown="searchOnEnter(event)" oninput="resetSearchIfEmpty()">
                </div>
                <button class="search-button" onclick="searchPokemon()">suchen</button>
            </div>
        </div>
    </header>
    <main>
        <div id="pokemonContainer">
            <!-- Test-Karten (werden jetzt per JavaScript aus der API erzeugt)
            <div class="pokemon-card">
                <h2>Bulbasaur</h2>
                <img src="./img/poke-ball.png" alt="">
            </div>
            <div class="pokemon-card">
                <h2>Ivysaur</h2>
                <img src="./img/poke-ball.png" alt="">
            </div>
            -->
        </div>
        <!-- wird erst angezeigt, wenn die ersten Pokémon geladen sind und es weitere gibt -->
        <div class="load-more-container">
            <button id="loadMoreButton" class="load-more-button d-none" onclick="loadMorePokemon()">
                <span class="load-more-spinner" aria-hidden="true"></span>
                <span class="load-more-text">Mehr Pokémon laden</span>
            </button>
        </div>
    </main>
    <dialog id="pokemonDialog">
        <div id="dialogContent"></div>
        <div class="dialog-buttons">
            <button onclick="closeDialog()">
                Schließen
            </button>
        </div>
    </dialog>
    <footer>
        <div class="footer-content">
            <div>© 2025 Pokedex</div>
            <div>Powered by PokeAPI</div>
        </div>
    </footer>
    <script src="db.js"></script>
    <script src="templates.js"></script>
    <script src="script.js"></script>

</body>

</html>
